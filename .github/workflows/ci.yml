name: Offline source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_public_release.py --root .
      - run: python tools/public_examples.py --output "$env:RUNNER_TEMP/sellerkit-demo"
      - run: python tools/verify.py --output "$env:RUNNER_TEMP/sellerkit-tests" --jobs 3
